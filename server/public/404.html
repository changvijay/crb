<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('crb-theme')||'light')}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Chang Research Base (CRB)</title>
  <meta name="description" content="The page you are looking for does not exist. Return to Chang Research Base (CRB) for AI-powered stock market analysis, Chang Reports &amp; Market Reports." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="canonical" href="https://crb.changtechs.com/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-root: #f7f8fb;
      --bg-panel: #ffffff;
      --accent: #2563eb;
      --text-1: #1e293b;
      --text-2: #475569;
      --text-3: #94a3b8;
      --border: #e2e8f0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Syne', system-ui, sans-serif;
      background: var(--bg-root);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .error-container {
      text-align: center;
      max-width: 520px;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 12px;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 0.95rem;
      color: var(--text-2);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .nav-links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .nav-links a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .nav-links .primary {
      background: var(--accent);
      color: #fff;
    }
    .nav-links .primary:hover { opacity: 0.9; }
    .nav-links .secondary {
      background: var(--bg-panel);
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .nav-links .secondary:hover { background: #f1f5f9; }
  </style>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The page you're looking for doesn't exist or has been moved. 
      Head back to the dashboard for AI-powered market analysis.
    </p>
    <nav class="nav-links" aria-label="Navigation">
      <a href="/" class="primary">Go to Dashboard</a>
      <a href="/news" class="secondary">Market News</a>
      <a href="/fundamentalIndicators" class="secondary">Fundamentals</a>
    </nav>
  </div>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "404 - Page Not Found",
    "description": "The requested page was not found on Chang Research Base",
    "url": "https://crb.changtechs.com/404",
    "isPartOf": {
      "@type": "WebSite",
      "name": "Chang Research Base",
      "url": "https://crb.changtechs.com"
    }
  }
  </script>
<script src="/js/theme.js"></script>
</body>
</html>
